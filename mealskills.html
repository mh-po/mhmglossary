<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓飯技能 - MHWilds Mini Glossary 小詞庫</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
 <link rel="icon" type="image/png" href="siteicon/favicon-96x96.png" sizes="96x96" />
      <link rel="shortcut icon" href="siteicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="siteicon/apple-touch-icon.png" />
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y6oos66zf2");
</script>
</head>
<body>

    <div class="app-layout">
        <!-- 動態載入的 nav.html -->
        <div id="nav-placeholder"></div>

        <!-- 頁面主要內容區塊 -->
        <main class="app-main">
            <header class="page-header">
                <h1 class="page-title">🍱 貓飯技能資料庫</h1>
                 <hr class="title">
            </header>

            <!-- 搜尋與按鈕篩選區 -->
            <section class="filter-section">
                <!-- 關鍵字搜尋框 + 按鈕 -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: stretch;">
                    <input type="text" id="searchInput" class="search-box" style="flex: 1; margin-bottom: 0;" placeholder="搜尋技能名稱（中/日/英）或效果說明關鍵字..." />
                    
                    <!-- 重置按鈕 -->
                    <button id="btnResetSearch" class="btn-filter" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 16px; cursor: pointer; white-space: nowrap;">
                        <span class="material-symbols-outlined" style="font-size: 18px;">restart_alt</span>重置
                    </button>

                    <!-- 我的最愛過濾按鈕 -->
                    <button id="btnFavFilter" class="btn-filter btn-fav-filter" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 16px; cursor: pointer; white-space: nowrap;">
                        <span class="material-symbols-outlined" style="font-size: 18px;">favorite</span>我的最愛
                    </button>
                </div>

                <!-- 遊戲版本篩選 -->
                <div class="filter-group" style="margin-top: 12px;">
                    <div id="gameVersionButtons" class="btn-group">
                <label class="filter-label">遊戲版本：</label>
                        <button class="btn-filter active" data-ver="ALL">全部</button>
                        <button class="btn-filter" data-ver="MHWilds">MHWilds</button>
                    </div>
                </div>
            </section>

            <!-- 統計與卡片列表區 -->
            <div id="resultStats" class="result-stats"></div>
            <div id="cardsContainer" class="cards-grid"></div>
            <div id="paginationContainer" class="pagination"></div>
              <div id="footer-placeholder"></div>
            
            </main>


      
    </div>
   <div class="fab-container">
    <button class="fab" onclick="scrollToTop()" title="去頂">keyboard_arrow_up</button>
    <button class="fab" onclick="scrollToBottom()" title="去底">keyboard_arrow_down</button>
  </div>
    <!-- 引用共用腳本與模組腳本 -->
    <script src="script/commonfav.js"></script>
    <script src="script/common.js"></script>
    <script src="script/mealskills.js"></script>
</body>
</html>
