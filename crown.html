<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大小金與任務進度 | MHWilds Mini Glossary 小詞庫</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/png" href="siteicon/favicon-96x96.png" sizes="96x96" />
      <link rel="shortcut icon" href="siteicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="siteicon/apple-touch-icon.png" />
    <link rel="manifest" href="siteicon/site.webmanifest" />
</head>
<body>
    <main>
    <div class="app-layout">
        <div id="nav-placeholder"></div>

        <main class="app-main">
            <div class="crown-tool-header page-title">
                <div><span>👑</span> <span>大小金與任務記錄器</span><hr class="title"></div>
                <div class="action-buttons">
                    <button class="btn-filter" style="border-color: #3b82f6; color: #3b82f6;" onclick="showMissingList()">
                        <span class="material-symbols-outlined">format_list_bulleted</span> 缺漏清單
                    </button>
                    <button class="btn-filter" style="border-color: #ef4444; color: #ef4444;" onclick="resetAllRecords()">
                        <span class="material-symbols-outlined">delete</span> 重設記錄
                    </button>
                    <button class="btn-filter" style="border-color: #f59e0b; color: #f59e0b;" onclick="generateText('need')">
                        <span class="material-symbols-outlined">campaign</span> 複製求助
                    </button>
                    <button class="btn-filter" style="border-color: #10b981; color: #10b981;" onclick="generateText('share')">
                        <span class="material-symbols-outlined">share</span> 複製分享
                    </button>
                </div>
            </div>

            <!-- 版本切換區 -->
            <div class="version-tabs" id="versionTabs">
                <button class="btn-filter active" data-ver="ALL">全部版本</button>
                <button class="btn-filter" data-ver="MHWilds">MHWilds</button>
                <button class="btn-filter" data-ver="Ascendance">(待更新)</button>
            </div>

            <!-- 成就感進度文字區 -->
            <div id="progressStats" class="progress-stats-bar">
                <!-- 由 JS 動態寫入 -->
            </div>

            <div class="filter-section crown-search-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜尋魔物名稱..." onkeyup="renderMonsters()">
                </div>
                <div class="filter-buttons" id="quickFilters" style="margin-top: 8px;">
                    <button class="btn-filter active" data-filter="all">全部顯示</button>
                    <!-- 新增：只顯示我缺漏的 (個人紀錄沒滿的) -->
                    <button class="btn-filter" data-filter="missing">只顯示我缺漏的</button>
                    <button class="btn-filter" data-filter="need">只顯示我標記求助的</button>
                    <button class="btn-filter" data-filter="share">只顯示我可分享的</button>
                </div>
            </div>

            <div class="cards-grid" id="crownContainer">
                <!-- 卡片顯示區 -->
            </div>
               <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- 檢視缺漏的 Modal DIV -->
    <div id="missingListModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="margin-bottom: 12px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between;">
                <span>📋 尚未獲得的大小金總覽</span>
                <button style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.5rem;" onclick="closeMissingList()">&times;</button>
            </h3>
            <div class="missing-list-box">
                <pre id="missingListText" class="missing-list-text"></pre>
            </div>
            <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn-filter" onclick="copyMissingText()" style="background: var(--primary-color); color: #fff;"><span class="material-symbols-outlined">content_copy</span>Copy</button>
                <button class="btn-filter" onclick="closeMissingList()">關閉</button>
            </div>
        </div>
         
    </div>

    <div class="fab-container">
    <button class="fab" onclick="scrollToTop()" title="去頂">keyboard_arrow_up</button>
    <button class="fab" onclick="scrollToBottom()" title="去底">keyboard_arrow_down</button>
  </div>
 


    <script src="script/common.js"></script>
   <script src="script/crown.js"></script>
    
</body>
</html>
