<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的最愛 - MHWilds Mini Glossary 小詞庫</title>
    
    <!-- Google Fonts Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
   <link rel="icon" type="image/png" href="siteicon/favicon-96x96.png" sizes="96x96" />
      <link rel="shortcut icon" href="siteicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="siteicon/apple-touch-icon.png" />
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y6oos66zf2");
</script>
</head>
<body>
    <div class="app-layout">
        <!-- 動態載入的 nav.html (側邊欄/頂部列) -->
        <div id="nav-placeholder"></div>

        <!-- 頁面主要內容區塊 -->
        <main class="app-main">
            <header class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <h1 class="page-title" style="display: inline-flex; align-items: center; gap: 8px;">
                    <span class="material-symbols-outlined" style="color: #ef4444;">favorite</span>
                    管理我的最愛書籤
                    </h1>
                                    
                <!-- 清空所有收藏按鈕 -->
                <button id="btnClearAllFav" class="btn-filter" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 16px; cursor: pointer; color: #ef4444; border-color: rgba(239, 68, 68, 0.3);">
                    <span class="material-symbols-outlined" style="font-size: 18px;">delete_forever</span>
                    清空所有收藏
                </button>
                
            </header>

            <!-- 搜尋與篩選區塊 -->
            <section class="filter-section">
                <!-- 搜尋框列 -->
                <div style="display: flex; gap: 8px; align-items: stretch; margin-bottom: 12px; flex-wrap: nowrap;">
                    <input type="search" id="searchInput" class="search-box" style="flex: 1; margin-bottom: 0;" placeholder="搜尋已收藏的名稱或備註..." />
                    <button id="btnResetSearch" class="btn-filter" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 16px; cursor: pointer; white-space: nowrap;">
                        <span class="material-symbols-outlined" style="font-size: 18px;">restart_alt</span>重置
                    </button>
                </div>

                <!-- 分類頁籤 (Tabs) -->
                <div id="favCategoryTabs" class="btn-group-filter" style="display: flex; flex-wrap: wrap; gap: 6px;">
                    <button class="btn-filter active" data-category="ALL">全部</button>
                    <button class="btn-filter" data-category="MONSTERS">魔物</button>
                    <button class="btn-filter" data-category="SKILLS">技能</button>
                    <button class="btn-filter" data-category="JEWELS">飾品珠</button>
                    <button class="btn-filter" data-category="CHARMS">護石</button>
                    <button class="btn-filter" data-category="MEALSKILLS">貓飯</button>
                    <button class="btn-filter" data-category="HUNTINGHORNS">狩獵笛</button>
                    <button class="btn-filter" data-category="KINSECTS">獵蟲</button>
                    <button class="btn-filter" data-category="GENERAL">綜合速查</button>
                </div>
            </section>

            <!-- 統計與分頁資訊 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 14px 0 10px 0; font-size: 0.88rem; color: var(--text-muted);">
                <div id="resultStats">共 <strong>0</strong> 個收藏項目</div>
                <div id="pageIndicator">頁數 0 / 0</div>
            </div>

            <!-- 卡片展示區 -->
            <div id="cardsContainer" class="cards-grid">
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                    <span class="material-symbols-outlined" style="font-size: 2rem; animation: spin 1s linear infinite;">autorenew</span>
                    <p style="margin-top: 10px;">讀取收藏資料中...</p>
                </div>
            </div>

            <!-- 分頁按鈕列 -->
            <div id="paginationContainer" class="pagination-wrapper" style="display: flex; justify-content: center; align-items: center; gap: 6px; margin: 24px 0 40px 0; flex-wrap: wrap;">
            </div>

            <!-- 可折疊的小提示組件 -->
            <details class="fav-tips-details" style="margin-top: 40px;">
                <summary class="fav-tips-summary">
                    <span class="material-symbols-outlined icon-bulb">lightbulb</span>
                    <span>我的最愛小提示（點擊展開 / 收合）</span>
                    <span class="material-symbols-outlined icon-arrow">expand_more</span>
                </summary>
                
                <div class="fav-tips-content">
                    <p class="tip-heading">什麼是我的最愛？</p>
                    <p>你在網站點擊 <strong>「加入我的最愛」</strong> 按鈕，會把項目儲存在當前瀏覽器的 <code>localStorage</code>。</p>

                    <p class="tip-heading">保存多久？</p>
                    <p>只要你不手動刪除或清除瀏覽器快取，它會一直保留。</p>

                    <p class="tip-heading">跨平台嗎？</p>
                    <p>不會。此功能為純本地離線存儲，不會同步到你的其他手機或電腦。</p>
                </div>
            </details>
            <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- 動態載入的 footer.html -->
    

    <!-- JS 腳本載入 (順序很重要) -->
    <script src="script/common.js"></script>
    <script src="script/card-templates.js"></script>
    <script src="script/favorite.js"></script>
</body>
</html>
