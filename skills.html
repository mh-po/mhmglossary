<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 技能資料 - MH Wilds Mini Glossary 小詞庫</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
     <link rel="icon" type="image/png" href="siteicon/favicon-96x96.png" sizes="96x96" />
      <link rel="shortcut icon" href="siteicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="siteicon/apple-touch-icon.png" />
</head>
<body>

    <div class="app-layout">
        <!-- 動態載入的 nav.html -->
        <div id="nav-placeholder"></div>

        <!-- 頁面主要內容區塊 -->
        <main class="app-main">
            <header class="page-header">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <h1 class="page-title"> <span class="material-symbols-outlined">auto_awesome</span>技能資料</h1>
                </div>
                <hr class="title">
            </header>

            <!-- 搜尋與按鈕篩選區 -->
            <section class="filter-section">
                <!-- 關鍵字搜尋框 + 重置 + 我的最愛 -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: stretch; flex-wrap: nowrap;">
                    <input type="search" id="searchInput" class="search-box" style="flex: 1; margin-bottom: 0;" placeholder="搜尋技能名稱 (繁/簡/日/英/別名)..." />
                    
                    <!-- 重置按鈕 -->
                    <button id="btnResetSearch" class="btn-filter" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 14px; cursor: pointer; white-space: nowrap;">
                        <span class="material-symbols-outlined" style="font-size: 18px;">restart_alt</span>重置
                    </button>

                    <!-- 我的最愛過濾按鈕 -->
                    <button id="btnFavFilter" class="btn-filter btn-fav-filter" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 14px; cursor: pointer; white-space: nowrap;">
                        <span class="material-symbols-outlined" style="font-size: 18px;">favorite</span>我的最愛
                    </button>
                </div>

                <!-- 篩選按鈕列容器 -->
                <div class="filter-groups-wrapper" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- 遊戲版本 Filter -->
                    <div class="filter-row" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                        <span class="filter-label" style="font-size: 0.85rem; color: var(--text-muted, #94a3b8); min-width: 70px;">遊戲版本：</span>
                        <div id="gameVersionFilter" class="btn-group-filter" style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <button class="btn-filter active" data-value="ALL">全部</button>
                            <button class="btn-filter" data-value="MHWilds">MHWilds</button>
                       </div>
                    </div>

                    <!-- 技能來源 Filter -->
                    <div class="filter-row" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                        <span class="filter-label" style="font-size: 0.85rem; color: var(--text-muted, #94a3b8); min-width: 70px;">技能來源：</span>
                        <div id="skillSourceFilter" class="btn-group-filter" style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <button class="btn-filter active" data-value="ALL">全部</button>
                        </div>
                    </div>

                    <!-- 技能標籤 Filter (含手機優化限高與平滑捲軸) -->
                    <div class="filter-row" style="display: flex; align-items: flex-start; gap: 8px;">
                        <span class="filter-label" style="font-size: 0.85rem; color: var(--text-muted, #94a3b8); min-width: 70px; pt-1;">技能標籤：</span>
                        <div id="skillTagScrollContainer" class="tag-scroll-box" style="flex: 1; max-height: 110px; overflow-y: auto; padding-right: 4px;">
                            <div id="skillTagFilter" class="btn-group-filter" style="display: flex; gap: 6px; flex-wrap: wrap;">
                                <button class="btn-filter active" data-value="ALL">全部</button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </section>

            <!-- 數據統計與資訊列 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 14px 0 10px 0; font-size: 0.88rem; color: var(--text-muted, #94a3b8);">
                <div id="resultStats">共 <strong>0</strong> 個技能</div>
                <div id="pageIndicator">頁數 0 / 0</div>
            </div>

            <!-- 技能卡片 Grid 網格容器 -->
            <div id="cardsContainer" class="cards-grid">
                <!-- 由 skills.js 動態渲染 -->
            </div>

            <!-- 分頁按鈕列 (Pagination) -->
            <div id="paginationContainer" class="pagination-wrapper" style="display: flex; justify-content: center; align-items: center; gap: 6px; margin: 24px 0 40px 0; flex-wrap: wrap;">
                <!-- 由 skills.js 動態渲染 -->
            </div>
            <details class="fav-tips-details">
            <summary class="fav-tips-summary">
                <span class="material-symbols-outlined icon-bulb">lightbulb</span>
                <span>技能速覽（點擊展開 / 收合）</span>
                <span class="material-symbols-outlined icon-arrow">expand_more</span>
            </summary>
                <div class="fav-tips-content">
                    <p class="tip-heading">內容以Mhwilds的版本為本，資料人手整合可能有錯漏。</p>
                    <h3>技能速覽</h3>
                        <!--for enlarge image part 1-->
                <div class="gallery"> 
                <div><img src="img/mhwilds_weaponskills.png" alt="weaponskills"></div>
                <div><img src="img/mhwilds_group_skills.png" alt="groupskills"></div>
                <div><img src="img/mhwilds_set_bonus_skills.png" alt="setbonusskills"></div>
                </div>

                <!-- for enloarge image part 2 Modal -->
                <div id="myModal" class="modal">
                <span class="close">&times;</span>
                <img class="modal-content" id="imgLarge">
                </div>
            </details>
            <div class="fab-container">
    <button class="fab" onclick="scrollToTop()" title="去頂">keyboard_arrow_up</button>
    <button class="fab" onclick="scrollToBottom()" title="去底">keyboard_arrow_down</button>
  </div>
             <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- JS 腳本載入 -->
    <script src="script/common.js"></script>
    <script src="script/commonfav.js"></script>
    <script src="script/skills.js"></script>
</body>
</html>
