<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>調合配方 - MHWilds Mini Glossary 小詞庫</title>    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css">
 <link rel="icon" type="image/png" href="siteicon/favicon-96x96.png" sizes="96x96" />
      <link rel="shortcut icon" href="siteicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="siteicon/apple-touch-icon.png" />
</head>
<body>
    <div class="app-layout">
        
        <!-- 導覽列佔位符 -->
        <div id="nav-placeholder"></div>

        <main class="app-main">
            
            <!-- 頁面標題 -->
            <h1 class="page-title">
                <span class="material-symbols-outlined">grocery</span>
                調合配方
            </h1>
            <hr class="title">
            <!-- 搜尋與篩選控制區 -->
            <div id="controls-section" class="filter-section">
                <!-- JavaScript 會在這裡生成 Search Bar 和分類按鈕 -->
            </div>

            <!-- 配方卡片網格 -->
            <div id="recipe-list" class="cards-grid" style="margin-top: 20px;">
                <p style="color: var(--text-muted);">資料載入中...</p>
            </div>
            <div id="footer-placeholder"></div>
        </main>
    </div>
    <div class="fab-container">
    <button class="fab" onclick="scrollToTop()" title="去頂">keyboard_arrow_up</button>
    <button class="fab" onclick="scrollToBottom()" title="去底">keyboard_arrow_down</button>
  </div>
    <!-- 頁尾佔位符 -->
    

    <!-- 遮罩 (給手機版側邊欄用) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- 載入腳本 -->
    <script src="script/common.js"></script>
    <script src="script/recipeapp.js"></script>
</body>
</html>
